apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addtaskapp
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sauravt01/Todo_App_Microservices.git
    targetRevision: main
    path: AddTaskTodoMicroservice/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: todoapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
