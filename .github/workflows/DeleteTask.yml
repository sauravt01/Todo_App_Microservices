name: Build and Push to ACR

on:
  push:
    branches: [ main ] 

permissions:
  id-token: write
  contents: read
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: todo-add-tasks-api
      IMAGE_TAG: v1
      ACR_NAME: devopsinsidersacr235
      ACR_LOGIN_SERVER: devopsinsidersacr235.azurecr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 1504262a-6362-4f8e-8ddd-1076f58b3789
          tenant-id: f0641df5-399b-4110-b104-73965dc34f37
          subscription-id: 5eb4a75d-ca9f-4447-9fba-c48dba45e976

      - name: Log in to ACR
        run: |
          az acr login --name acrtodoappsaurav007
      - name: Build Docker Image
        run: |
          docker build -t deletetask DeleteTaskTodoMicroservice
      - name: Tag Docker Image for ACR
        run: |
          docker tag deletetask acrtodoappsaurav007.azurecr.io/deletetask:v1
      - name: Push Docker Image to ACR
        run: |
          docker push acrtodoappsaurav007.azurecr.io/deletetask:v1
